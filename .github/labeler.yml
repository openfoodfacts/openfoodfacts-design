GitHub:
- changed-files:
  - any-glob-to-any-file: '.github/**/*'

github_actions:
- changed-files:
  - any-glob-to-any-file: '.github/workflows/**/*'

"📚 Documentation":
- changed-files:
  - any-glob-to-any-file: '**/*.md'

"🐾 Open Pet Food Facts":
- changed-files:
  - any-glob-to-any-file:
    - 'images/illustrations/pet-food/**/*'
    - 'images/logos/openpetfoodfacts/**/*'

"📸 Open Products Facts":
- changed-files:
  - any-glob-to-any-file:
    - 'images/illustrations/products/**/*'
    - 'images/logos/openproductsfacts/**/*'

"🍊 Open Food Facts":
- changed-files:
  - any-glob-to-any-file:
    - 'images/illustrations/food/**/*'
    - 'images/logos/openfoodfacts/**/*'
    - 'UXR OFF/**/*'

"🧴 Open Beauty Facts":
- changed-files:
  - any-glob-to-any-file:
    - 'images/illustrations/beauty/**/*'
    - 'images/logos/openbeautyfacts/**/*'

"💸 Open Prices":
- changed-files:
  - any-glob-to-any-file:
    - 'images/illustrations/prices/**/*'
    - 'images/logos/openprices/**/*'
    - 'UXR Open Prices/**/*'

Illustrations:
- changed-files:
  - any-glob-to-any-file: 'images/illustrations/**/*'

Logos:
- changed-files:
