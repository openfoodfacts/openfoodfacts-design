    - 'images/logos/nutri-score/**/*'
    - 'images/logos/openfoodfacts/nutriscore/**/*'
    - '**/*nutri-score*'
    - '**/*nutriscore*'

green-score:
- changed-files:
  - any-glob-to-any-file:
    - 'images/logos/green-score/**/*'
    - '**/*green-score*'
    - '**/*greenscore*'
    - '**/*GreenScore*'

UXR:
- changed-files:
  - any-glob-to-any-file: 'UXR*/**/*'

Characters:
- changed-files:
  - any-glob-to-any-file:
